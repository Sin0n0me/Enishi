# Global bone-name overrides, loaded at startup. Restart after editing.
# Each configured role REPLACES its default aliases. Unlisted roles keep defaults.
# Format: role "first candidate" "second candidate" ...
# Matching is case-sensitive; candidates are tried left to right.
# Use UTF-8. Names must be nonempty and quoted. Duplicate role lines are errors.
# If the file contains an error, the entire file is ignored and defaults are used.
#
# Examples (disabled):
# neck "custom_neck" "neck" "Neck"
# left_lower_leg "custom_left_knee" "leftLowerLeg" "LeftLeg"
#
# Roles:
# neck head spine hips
# left_upper_arm left_lower_arm left_hand left_eye
# right_upper_arm right_lower_arm right_hand right_eye
# left_upper_leg left_lower_leg left_foot
# right_upper_leg right_lower_leg right_foot
