# 文字コードはUTF-8です。起動時に読み込みます。
# 名前の候補はbone_names.tomlとmorph_names.tomlで設定します。

[camera]
# 起動時に読み込みます。off：ホイールを上に回すと前進、on：移動方向を反転します。
invert_wheel off

[cursor_tracking]
# 角度の単位は度、arm_speedの単位は度/秒です。起動時に読み込みます。
neck_yaw 10
neck_pitch 6
head_yaw 25
head_pitch 15
arm_speed 90
# カーソルへ手を伸ばす際の、ボーンOBBによる実験的な衝突回避です。on：有効、off：無効。
experimental_obb_collision off
# その場で上方向へジャンプします。高さは骨格の高さに対する比率、時間の単位は秒です。
jump_enabled on
jump_height_ratio 0.18
jump_duration 0.65
jump_delay 0.35
jump_cooldown 1.5

[model_events]
"*" "click" "*" impulse 0 0 5.0 on
