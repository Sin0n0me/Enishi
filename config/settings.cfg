# UTF-8. Reloaded at startup. Name aliases remain in bone_names.toml and morph_names.toml.

[camera]
# Reloaded at startup. off: wheel up moves forward; on: reverse the direction.
invert_wheel off

[cursor_tracking]
# Angles in degrees; arm_speed in degrees per second. Reloaded at startup.
neck_yaw 10
neck_pitch 6
head_yaw 25
head_pitch 15
arm_speed 90
# Experimental bone OBB avoidance for cursor reaching: on/off.
experimental_obb_collision off
# Stationary upward jump. Height is a fraction of skeleton height; times are seconds.
jump_enabled on
jump_height_ratio 0.18
jump_duration 0.65
jump_delay 0.35
jump_cooldown 1.5

[model_events]
"*" "click" "*" impulse 0 0 5.0 on
