# 全モデル共通のボーン名設定です。起動時に読み込むため、編集後は再起動してください。
# 指定した役割の既定候補を置き換えます。未指定の役割は既定値を使います。
# 大文字と小文字を区別し、左の候補から順に検索します。
# 文字コードはUTF-8です。候補は空でない文字列の配列で、1件以上必要です。
# 設定に誤りがある場合はファイル全体を適用せず、既定値を使います。
version = 1

# 設定例（コメントを外すと有効になります）：
# [roles.neck]
# aliases = ["custom_neck", "neck"]

# 指定できる役割のキー：
# neck head spine hips
# left_upper_arm left_lower_arm left_hand left_eye
# right_upper_arm right_lower_arm right_hand right_eye
# left_upper_leg left_lower_leg left_foot
# right_upper_leg right_lower_leg right_foot
