# Push targets: all, none, or space-separated Kinematic Dynamic DynamicAdjustBone.
# Kinematic hits are reported in the click UI; animation-driven bodies do not receive physical impulses.
# Restart the application after editing this file.
# Example: push_states Dynamic DynamicAdjustBone
push_states all
# UTF-8. Initial configuration intentionally plays no animations.
# Selectors: "model name/path substring (or *)" "event" "exact bone name (or *)"
# Actions after selectors: impulse X Y Z on|off, motion "path" off|once|loop, or none.
# Legacy "motion path" mode rows remain supported. Paths are relative to this file.
# Impulses use world coordinates and act at the clicked point on Dynamic/DynamicAdjustBone bodies.
# X/Y/Z specify impulse momentum, not continuous force; adjust for each model's mass.
# Use none to suppress an action for a model/bone; off rows do not override enabled rules.
# Disabled rows never load their motion files. Change off explicitly to enable a rule.
# Bone-specific rules take precedence, then model-specific rules; first row wins equal ties.
# Event names are extensible; currently mouse clicks emit "click".
# The files below are development motions and MUST remain off in the initial configuration.
"*" "click" "*" impulse 0 0 0.05 on
"結月ゆかり" "click" "*" "../assets/motion/手を振る.vmd" off
"紲星あかり" "click" "*" "../assets/motion/手を振る_紲星あかり用.vmd" off
"結月ゆかり" "random" "*" "../assets/motion/歩く_結月ゆかり用.vmd" off
