name: Windows CMake

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        config: [Release, Debug]
        #platform: [x86, x64]
        platform: [x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Setup Developer Command
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.platform }}

      - name: Configure
        run: |
          cmake -S src -B build -G "Visual Studio 17 2022" -A ${{ matrix.platform }}
        shell: cmd

      - name: Build
        run: |
          cmake --build build --config ${{ matrix.config }} --parallel
        shell: cmd